id = "pi"
version = "2026.09.08.1"
min_engine_version = 1
updated_at = "2026-09-08T00:00:00Z"
aliases = ["herdr:pi"]

# Pi 0.85 renders the activity spinner in the editor's top border.
# Keep the match at the bottom so quoted tool output is not activity.
[[rules]]
id = "working_editor_border"
state = "working"
priority = 110
region = "bottom_non_empty_lines(5)"
visible_working = true
line_regex = ['^─{2,}\s+[⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏]\s+Working\s+─+\s*$']

[[rules]]
id = "working_literal"
state = "working"
priority = 100
region = "whole_recent"
visible_working = true
contains = ["Working..."]
